<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>匹配与投递 · Boss Match Helper</title>
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <header>
      <div>
        <h1>匹配与投递</h1>
        <p>匹配复盘与投递结果，均保存在本机</p>
      </div>
      <div class="actions">
        <button id="btnRefresh" class="secondary">刷新</button>
        <button id="btnClear" class="danger">清空当前</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" data-tab="match" role="tab" aria-selected="true">
        匹配
      </button>
      <button type="button" class="tab" data-tab="deliver" role="tab" aria-selected="false">
        投递结果
      </button>
    </nav>

    <section id="panel-match" class="panel" data-panel="match">
      <div id="stats-match" class="stats"></div>
      <table>
        <thead>
          <tr>
            <th>时间</th>
            <th>分数</th>
            <th>建议</th>
            <th>职位</th>
            <th>公司</th>
            <th>理由</th>
          </tr>
        </thead>
        <tbody id="tbody-match"></tbody>
      </table>
      <p id="empty-match" class="empty" hidden>
        暂无匹配记录。在 Boss 职位页「采集并匹配」后会出现在这里。
      </p>
    </section>

    <section id="panel-deliver" class="panel" data-panel="deliver" hidden>
      <div id="stats-deliver" class="stats"></div>
      <table>
        <thead>
          <tr>
            <th>招呼时间</th>
            <th>状态</th>
            <th>分数</th>
            <th>职位</th>
            <th>公司</th>
            <th>薪资</th>
            <th>理由</th>
          </tr>
        </thead>
        <tbody id="tbody-deliver"></tbody>
      </table>
      <p id="empty-deliver" class="empty" hidden>
        暂无投递结果。在职位页对「建议投」执行「自动打招呼」成功后会出现在这里。
      </p>
    </section>

    <script type="module" src="history.js"></script>
  </body>
</html>
